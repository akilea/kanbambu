<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kanbambu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2322a06b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9V2h12v7'/><rect x='6' y='14' width='12' height='8' rx='1'/><path d='M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2'/></svg>">
  <link rel="stylesheet" href="style.css">
  <script>try { const t = localStorage.getItem("kanbambu-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="top">
    <div class="brand"><svg class="i"><use href="#i-printer"/></svg><b>kanbambu</b></div>
    <div id="totals" class="totals" title="Filament à imprimer (Analysed + Printing)"></div>
    <button id="settings" class="ib" title="Réglages"><svg class="i"><use href="#i-settings"/></svg></button>
    <button id="theme" class="ib" title="Thème clair / sombre"><svg class="i"><use href="#i-moon"/></svg></button>
    <button id="addEpic" class="btn" title="Nouvel epic (groupe de projets)"><svg class="i"><use href="#i-plus"/></svg><svg class="i"><use href="#i-folders"/></svg></button>
    <button id="addProject" class="btn primary" title="Nouveau projet"><svg class="i"><use href="#i-plus"/></svg><svg class="i"><use href="#i-folder-open"/></svg></button>
  </header>
  <nav id="mtabs" class="mtabs"></nav>
  <div class="lanes-head">
    <div><svg class="i"><use href="#i-puzzle"/></svg>Pièces</div>
    <div><svg class="i"><use href="#i-list-todo"/></svg>Queue</div>
    <div><svg class="i"><use href="#i-printer"/></svg>Printing</div>
    <div><svg class="i"><use href="#i-flag-triangle-right"/></svg>Done</div>
  </div>
  <main id="board"></main>
  <div id="empty" class="empty" hidden>
    <svg class="i xl"><use href="#i-folder-open"/></svg>
    <p>Aucun projet</p>
  </div>
  <div id="modal" class="modal" hidden><div class="sheet"></div></div>
  <script src="vendor/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
